artifacts = ["/app/output"]

[metadata]
category = "Machine Learning and AI"
subcategory = "Model inference and prediction"
task_objective = ["Implement", "Optimize"]
artifact_type = ["Single script or program"]
expert_time_estimate_hours = 6.0
metric_name = "Mean per-subgraph AUROC of directed-edge scores over a sealed panel of connected 5-node gauge subgraphs"
objective = "maximize"

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
]
timeout_sec = 14400.0
user = "agent"

[verifier]
timeout_sec = 2700.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 3600.0
cpus              = 8
memory_mb         = 14336
gpus              = 0
boot_disk_gb      = 150
network_mode      = "no-network"

[environment]
build_timeout_sec = 3600.0
cpus              = 8
memory_mb         = 14336
gpus              = 0
boot_disk_gb      = 150
network_mode      = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
