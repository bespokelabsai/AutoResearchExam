artifacts = ["/app/output"]

[metadata]
category = "Machine Learning and AI"
subcategory = "Model inference and prediction"
task_objective = ["Implement", "Optimize"]
artifact_type = ["Single script or program"]
expert_time_estimate_hours = 5.0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
]
timeout_sec = 21600.0

[verifier]
timeout_sec = 10800.0
environment_mode = "separate"
network_mode = "no-network"

[environment]
build_timeout_sec = 10800.0
cpus              = 2
memory_mb         = 16384
gpus              = 1
gpu_type          = "H100"
boot_disk_gb       = 300
storage_mb        = 307200
network_mode      = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
]
