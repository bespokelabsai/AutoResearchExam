artifacts = ["/app/output"]

[metadata]
category = "Machine Learning and AI"
subcategory = "Feature engineering"
task_objective = ["Implement", "Optimize"]
artifact_type = ["Single script or program"]
expert_time_estimate_hours = 3.0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
]
timeout_sec = 14400.0
user = "agent"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 3600.0
cpus              = 8
memory_mb         = 14336
gpus              = 0
storage_mb = 153600
network_mode      = "no-network"

[environment]
build_timeout_sec = 3600.0
cpus              = 8
memory_mb         = 14336
gpus              = 0
storage_mb = 153600
network_mode      = "allowlist"
allowed_hosts = ["api.openai.com", "api.anthropic.com"]
