schema_version = "1.4"
artifacts = [
    { source = "/var/lib/are", service = "grader" },
]

[task]
name = "bespokelabs/less-is-more-pretrain-token-budget-selector"
version = "1.1.0"
description = ""
keywords = [
    "autoresearch",
    "machine-learning",
    "benchmark",
]
authors = [
    { name = "Bespoke Labs" },
]

[metadata]
task_slug = "less-is-more-pretrain-token-budget-selector"
title = "Spend a pretraining token budget: write the corpus selector that minimises held-out perplexity"
category = "Model Training and ML Infrastructure"
subcategory = "Data loading and training pipelines"
expert_time_estimate_hours = 8.0
objective = "maximize"
metric_name = "percent reduction in held-out perplexity of the pinned 124M GPT trained on the agent-selected <=125M-token subset of the sealed 250M-token pool, relative to the same pinned trainer run on the entire pool"
reward_map = "rational_squash"
degenerate_reward = 0.1
graded_gpu = "H100"
dataset = "allenai/c4 (en and en.noclean), revision 1588ec454efa1a09f29cd18ddd04fe05fc8653a2"
notes = "Open-ended: continuous reward in [0,1], no threshold, no reference solution. Anchors and measurements are never disclosed to the agent."
are_version = "1.1"
budget_seconds = 86400

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[[verifier.collect]]
service = "grader"
command = "/opt/are/venv/bin/python /opt/are/drain.py"
timeout_sec = 28800.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
gpus = 0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
    "grader",
]
timeout_sec = 86400.0
user = "agent"

[environment]
network_mode = "public"
build_timeout_sec = 10800.0
os = "linux"
cpus = 8
memory_mb = 32768
storage_mb = 307200
gpus = 1
gpu_types = [
    "H100",
]
mcp_servers = [
    { name = "are", transport = "streamable-http", url = "http://grader:8000/mcp" },
]

[environment.env]
