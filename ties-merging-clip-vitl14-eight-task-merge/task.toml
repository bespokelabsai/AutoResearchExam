artifacts = ["/app/output"]

[metadata]
category = "Machine Learning and AI"
subcategory = "Computer vision"
task_objective = ["Implement", "Optimize"]
artifact_type = ["Single script or program", "Generated output artifact"]
expert_time_estimate_hours = 6.0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
]
timeout_sec = 21600.0

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"

[environment]
build_timeout_sec = 14400.0
cpus              = 8
memory_mb         = 65536
gpus              = 1
gpu_type          = "H100"
boot_disk_gb       = 300
storage_mb        = 307200
network_mode      = "allowlist"
allowed_hosts = [
    "deb.debian.org",
    "security.debian.org",
    "archive.ubuntu.com",
    "security.ubuntu.com",
    "developer.download.nvidia.com",
    "packages.cloud.google.com",
    "raw.githubusercontent.com",
    "nodejs.org",
    "registry.npmjs.org",
    "downloads.claude.ai",
    "api.openai.com",
    "api.anthropic.com",
]
