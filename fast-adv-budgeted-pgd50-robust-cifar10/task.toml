schema_version = "1.4"
artifacts = [
    { source = "/var/lib/are", service = "grader" },
]

[task]
name = "bespokelabs/fast-adv-budgeted-pgd50-robust-cifar10"
version = "1.1.0"
description = ""
keywords = [
    "autoresearch",
    "machine-learning",
    "benchmark",
]
authors = [
    { name = "Bespoke Labs" },
]

[metadata]
category = "Model Training and ML Infrastructure"
subcategory = "Training loops"
task_objective = [
    "Implement",
    "Optimize",
    "Secure or harden",
]
artifact_type = [
    "Single script or program",
    "Generated output artifact",
]
expert_time_estimate_hours = 4.0
metric_name = "PGD-50 robust accuracy (percent) on the sealed 10,000-image CIFAR-10 test split at eps=8/255"
metric_objective = "maximize"
are_version = "1.1"
budget_seconds = 86400

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[[verifier.collect]]
service = "grader"
command = "/opt/are/venv/bin/python /opt/are/drain.py"
timeout_sec = 14400.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
gpus = 0

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.openai.com",
    "api.anthropic.com",
    "grader",
]
timeout_sec = 86400.0

[environment]
network_mode = "public"
build_timeout_sec = 14400.0
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 307200
gpus = 1
gpu_types = [
    "H100",
]
mcp_servers = [
    { name = "are", transport = "streamable-http", url = "http://grader:8000/mcp" },
]

[environment.env]
